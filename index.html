<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070c" />
    <meta name="color-scheme" content="dark" />
    <title>CAR ROULETTE — рулетка автомобилей</title>
    <meta
      name="description"
      content="Крути автомобильную рулетку: больше 2000 поколений машин от первого Benz 1886 года до современных гиперкаров. Коллекция, достижения, фильтры и честный рандом."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CAR ROULETTE — рулетка автомобилей" />
    <meta property="og:description" content="Твоя следующая машина — случайность. Больше 2000 поколений автомобилей, коллекция и достижения." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="preload" href="assets/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script defer src="assets/data/cars.js"></script>
    <script defer src="assets/js/core.js"></script>
    <script defer src="assets/js/fx.js"></script>
    <script defer src="assets/js/app.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="./" aria-label="CAR ROULETTE — на главную">
          <span class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 17h14M3 17v-4l2-5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5v4" />
              <circle cx="7.5" cy="17" r="2" />
              <circle cx="16.5" cy="17" r="2" />
            </svg>
          </span>
          <span>
            <span class="wordmark">CAR ROULETTE</span>
            <span class="brand-meta" id="brandMeta"></span>
          </span>
        </a>
        <div class="top-actions">
          <button class="pill-btn" type="button" data-action="open" data-view="filters">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" /></svg>
            <span class="lbl">Фильтры</span>
            <span class="badge" id="filterBadge" hidden></span>
          </button>
          <button class="icon-btn" type="button" data-action="open" data-view="settings" aria-label="Настройки">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </svg>
          </button>
        </div>
      </header>

      <main>
        <div id="app-error" class="card empty-result" hidden>
          Не удалось загрузить приложение. Проверьте, что рядом с index.html лежит папка <code>assets</code>, и обновите страницу.
        </div>

        <section class="hero">
          <p class="eyebrow"><span class="dot" aria-hidden="true"></span><span id="statLine">Загрузка базы…</span></p>
          <h1>Твоя следующая машина — <span class="grad">случайность</span></h1>
        </section>

        <section class="machine" id="machine" aria-label="Рулетка">
          <div class="lights" id="lights" aria-hidden="true"></div>
          <div class="reels" aria-hidden="true">
            <div class="reel">
              <div class="reel-label">Марка</div>
              <div class="reel-window"><span class="pointer left"></span><div class="reel-strip"></div><span class="pointer right"></span></div>
            </div>
            <div class="reel">
              <div class="reel-label">Модель</div>
              <div class="reel-window"><span class="pointer left"></span><div class="reel-strip"></div><span class="pointer right"></span></div>
            </div>
            <div class="reel">
              <div class="reel-label">Поколение</div>
              <div class="reel-window"><span class="pointer left"></span><div class="reel-strip"></div><span class="pointer right"></span></div>
            </div>
          </div>

          <div class="machine-bottom">
            <div class="pool" id="pool"></div>
            <button class="spin-btn" id="spinBtn" type="button">
              <span class="label">КРУТИТЬ</span>
              <span class="hint">Пробел или Enter</span>
            </button>
            <div class="controls">
              <div class="segmented" id="modeSwitch" role="radiogroup" aria-label="Режим шансов">
                <button type="button" role="radio" data-action="mode" data-value="weighted" aria-checked="true">По редкости</button>
                <button type="button" role="radio" data-action="mode" data-value="equal" aria-checked="false">Равные шансы</button>
              </div>
              <label class="switch"><input type="checkbox" id="noRepeat" /> Без повторов</label>
              <button class="chip link" type="button" data-action="open" data-view="odds">
                <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 16v-4M12 8h.01" /></svg>Шансы
              </button>
            </div>
          </div>
        </section>

        <section class="result" id="result" aria-live="polite" aria-atomic="true"></section>
        <section class="daily" id="daily" aria-label="Машина дня"></section>

        <footer class="footer">
          CAR ROULETTE · вся база и прогресс хранятся локально в браузере ·
          <a href="https://github.com/kubok758/Car-Roulette-" target="_blank" rel="noopener noreferrer">исходный код</a>
        </footer>
      </main>
    </div>

    <div class="dock">
      <button class="quick-spin" id="quickSpin" type="button" tabindex="-1">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" /></svg>
        КРУТИТЬ ЕЩЁ
      </button>
      <nav class="dock-nav" aria-label="Разделы">
        <button type="button" data-action="open" data-view="history">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l3 2" /></svg>
          <span>История</span>
        </button>
        <button type="button" data-action="open" data-view="garage">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 2.9 1-6.2L3 9.6l6.2-.9z" /></svg>
          <span>Гараж</span>
        </button>
        <button type="button" data-action="open" data-view="collection">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="2" />
            <rect x="14" y="3" width="7" height="7" rx="2" />
            <rect x="3" y="14" width="7" height="7" rx="2" />
            <rect x="14" y="14" width="7" height="7" rx="2" />
          </svg>
          <span>Коллекция</span>
          <i class="notify-dot" id="collectionDot" hidden></i>
        </button>
        <button type="button" data-action="open" data-view="catalog">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z" />
            <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5" />
          </svg>
          <span>Каталог</span>
        </button>
        <button type="button" data-action="open" data-view="stats">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3" /></svg>
          <span>Статистика</span>
        </button>
      </nav>
    </div>

    <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle" tabindex="-1">
      <div class="sheet-head">
        <div class="grow">
          <h2 id="sheetTitle"></h2>
          <div class="sub" id="sheetSub"></div>
        </div>
        <button class="icon-btn" type="button" data-action="close" aria-label="Закрыть">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot" hidden></div>
    </dialog>

    <dialog class="sheet narrow" id="carDialog" aria-label="Карточка автомобиля" tabindex="-1">
      <div class="sheet-head">
        <div class="grow"><h2 style="font-size: 16px">Карточка автомобиля</h2></div>
        <button class="icon-btn" type="button" data-action="close" aria-label="Закрыть">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="sheet-body" id="carDialogBody" style="padding: 0"></div>
    </dialog>

    <dialog class="sheet small" id="confirmDialog" aria-labelledby="confirmTitle" tabindex="-1">
      <div class="sheet-body">
        <h2 id="confirmTitle" style="margin: 0 0 8px; font-family: var(--font-display); font-size: 20px"></h2>
        <p id="confirmText" style="margin: 0; color: var(--text-2)"></p>
      </div>
      <div class="sheet-foot">
        <span class="grow"></span>
        <button class="btn" type="button" data-action="close">Отмена</button>
        <button class="btn danger" type="button" id="confirmOk">Удалить</button>
      </div>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <canvas id="fx" aria-hidden="true"></canvas>
    <noscript><p style="text-align: center; padding: 20px">Для работы рулетки нужен включённый JavaScript.</p></noscript>
  </body>
</html>
